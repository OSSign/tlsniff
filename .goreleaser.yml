version: 2

builds:
  - id: linux
    main: main.go
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    
  - id: mac
    main: main.go
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
  
  - id: windows
    main: main.go
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
  
archives:
  - id: unixarchive
    ids:
      - linux
      - mac
    formats: [ tar.gz, binary ]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{ .Arch }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
  - id: windowsarchive
    ids:
      - windows
    formats: [ zip, binary ]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{ .Arch }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

nfpms:
  - id: nfpms
    ids:
      - linux
    formats:
      - deb
      - apk
      - rpm
    package_name: "tlsniff"
    description: "tlsniff - A certificate information tool"
    vendor: "OSSign"
    maintainer: OSSign <contact@ossign.org>
    file_name_template: >-
      {{ .ProjectName }}_{{- title .Os }}_{{ .Arch }}{{- if .Arm }}v{{ .Arm }}{{ end }}

signs:
  - id: win-sign
    ids:
      - windowsarchive
    cmd: ossign
    output: true
    artifacts: "binary"
    args:
      - "-o"
      - ${artifact}
      - "-t"
      - "pecoff"
      - ${artifact}

notarize:
  macos:
    - enabled: true
      ids:
        - mac

      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
        entitlements: ./entitlements.plist
      
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

release:
  ids:
    - mac
    - win-sign
    - nfpms
    - linux
  github:
    owner: ossign
    name: tlsniff
