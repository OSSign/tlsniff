name: Build and Publish Packages

on:
  push:
    tags: ["*.*.*"]


jobs:
  build:
    permissions:
      contents: write
      id-token: write
      packages: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        depth: 0

    - id: go
      name: Install go
      uses: actions/setup-go@v5
      with:
        go-version: 1.27.2
        cache-dependency-path: go.mod

    - name: Setup OSSign
      uses: ossign/ossign@main
      with:
        installOnly: true
        trustedSigning: true
        trustedSigningKey: evcode

    - name: Get token for osshield
      id: osshield-repo
      uses: OSSign/actions/github-trusted@main
      with:
        audience: "https://pkg.osshield.eu"
        exchange: "https://pkg.osshield.eu/api/v1/auth/github/exchange"

    - name: Goreleaser
      uses: goreleaser/goreleaser-action@v6
      if: ${{ github.ref_name != 'main' }}
      with:
        version: ${{ github.event.release.tag.name }}
        args: release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO_TOKEN: ${{ steps.osshield-repo.outputs.trusted_token }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release
        path: dist/**

